  - goal_specification
  - context_specification
  - constraint_specification
prompt_file: prompt.md
notes_file: note.md
workspace_source: workspace-exp
mcp:
  entry: mcp/server.py
  endpoint: /mcp
  tools:
    - lora_train_list_available_tools
    - lora_train_inspect_training_request
    - lora_train_read_train_val_data
